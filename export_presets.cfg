; Kangur export presets (Godot 4.7.2).
; Both presets produce a single self-contained executable (embedded PCK).
; Editor-only addons, test scenes, tooling and generated reports are excluded.
; NOTE: addons/godot-vision-cone is deliberately NOT excluded: the game uses the
; VisionCone2D class from that addon at runtime (src/vision/vision_system.gd).
; Build with tools/build_release.sh — CLI paths override export_path below.

[preset.0]

name="Linux x86_64"
platform="Linux"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="res://addons/at-icons/*, addons/at-icons/*, res://addons/gdUnit4/*, addons/gdUnit4/*, res://reports/*, reports/*, res://tests/*, tests/*, res://tools/*, tools/*, res://docs/*, docs/*"
export_path="build/linux-x86_64/kangur.x86_64"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"

[preset.1]

name="Windows x86_64"
platform="Windows Desktop"
runnable=false
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter=""
exclude_filter="res://addons/at-icons/*, addons/at-icons/*, res://addons/gdUnit4/*, addons/gdUnit4/*, res://reports/*, reports/*, res://tests/*, tests/*, res://tools/*, tools/*, res://docs/*, docs/*"
export_path="build/windows-x86_64/kangur.exe"
patches=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=1

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=0
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
application/icon="res://assets/ui/icons/kangur_icon.ico"
application/icon_interpolation=4
application/console_wrapper_icon=""
application/file_version="0.1.0.0"
application/product_version="0.1.0.0"
application/company_name="Maxwell Jensen"
application/product_name="Kangur"
application/file_description="Kangur - singleplayer topdown tactical shooter"
application/copyright="EUPL-1.2"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
